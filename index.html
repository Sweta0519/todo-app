<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Todo App</h1>
    <div class="add-task">
      <input type="text" id="task-input" placeholder="Add a task..." />
      <button id="add-btn">Add task</button>
    </div>
    <ul id="task-list"></ul>
    <p id="empty-state" class="empty-state">No tasks yet. Add your first one above.</p>
    <div class="footer-row">
      <span id="task-counter" class="task-counter"></span>
      <button id="clear-completed-btn" class="clear-completed-btn">Clear completed</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
